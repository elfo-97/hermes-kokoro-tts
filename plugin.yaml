name: kokoro
version: 0.3.0
description: "Kokoro-82M local TTS for Hermes: 54 voices, 9 languages, CPU only, no API key"
author: Jhonatan
# Kokoro runs in its own Python (`kokoro` + `soundfile` + `numpy`), picked by the Interpreter
# setting below, so this plugin manages its own runtime instead of joining Hermes' environment.
python_runtime: external
config_schema:
  language:
    type: str
    choices: [en-us, en-gb, es, fr, hi, it, ja, pt-br, zh]
    default: en-us
    label: Language
    description: "Voices come from the model itself; the first voice of the language is used unless you pick one below."
  voice:
    type: str
    default: ""
    label: Voice
    description: "Empty uses the first voice of the language. The id is language + gender: pf_dora (pt-BR female), am_michael (en-US male)."
    choices:
      - af_heart
      - af_alloy
      - af_aoede
      - af_bella
      - af_jessica
      - af_kore
      - af_nicole
      - af_nova
      - af_river
      - af_sarah
      - af_sky
      - am_adam
      - am_echo
      - am_eric
      - am_fenrir
      - am_liam
      - am_michael
      - am_onyx
      - am_puck
      - am_santa
      - bf_alice
      - bf_emma
      - bf_isabella
      - bf_lily
      - bm_daniel
      - bm_fable
      - bm_george
      - bm_lewis
      - ef_dora
      - em_alex
      - em_santa
      - ff_siwis
      - hf_alpha
      - hf_beta
      - hm_omega
      - hm_psi
      - if_sara
      - im_nicola
      - jf_alpha
      - jf_gongitsune
      - jf_nezumi
      - jf_tebukuro
      - jm_kumo
      - pf_dora
      - pm_alex
      - pm_santa
      - zf_xiaobei
      - zf_xiaoni
      - zf_xiaoxiao
      - zf_xiaoyi
      - zm_yunjian
      - zm_yunxi
      - zm_yunxia
      - zm_yunyang
  python:
    type: str
    default: ""
    label: Interpreter
    description: "Python with `kokoro` and `soundfile`. Empty uses the interpreter Hermes runs on."
  port:
    type: int
    default: 51235
    label: Daemon port
    description: "Local port the warm daemon listens on. Change it only if 51235 is already taken."
  idle_seconds:
    type: int
    default: 300
    label: Idle unload (seconds)
    description: "How long the daemon keeps the model in memory after the last request."
